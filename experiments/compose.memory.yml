name: career

services:
  redis:
    image: ${MEMORY_REDIS_IMAGE:-redis:7.4-alpine}
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:${MEMORY_REDIS_PORT:-6380}:6379'
    volumes:
      - memory-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  memory-redis:
    external: true
    name: career-agent-memory_memory-redis

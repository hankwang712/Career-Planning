<div id="navWorkspaceShell" class="nav-workspace-shell relative">
    <button type="button" id="navWorkspaceToggle" class="nav-workspace-pill" aria-expanded="false" aria-haspopup="menu" aria-controls="navWorkspaceMenu" aria-label="工作区菜单">
        <span class="nav-workspace-avatar-wrap">
            <span id="currentUserAvatar" class="nav-workspace-avatar-inner"{% if recruitment_nav|default(false) %} data-avatar-url="{{ url_for('site.api_user_state', scope='account_avatar') }}"{% endif %}>{% if initial_user %}{{ '管' if initial_user.role == 'super_admin' else (initial_user.display_name or initial_user.username)[:1]|upper }}{% else %}人{% endif %}</span>
        </span>
        <span id="navWorkspaceTitle" class="nav-workspace-title">个人空间</span>
        <svg class="nav-workspace-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 9l6 6 6-6"></path>
        </svg>
    </button>
    <div id="navWorkspaceMenu" class="nav-workspace-menu hidden" role="menu" aria-labelledby="navWorkspaceToggle">
        <a href="{{ url_for('resume_editor.index') }}" onclick="closeNavWorkspaceMenu()" class="nav-workspace-menu-row nav-workspace-menu-link" role="menuitem" title="个人中心">
            <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="nav-workspace-menu-row-text">{{ '我的简历' if account_menu_in_center|default(false) else '个人中心' }}</span>
        </a>
        {% if initial_user and initial_user.can_manage_configs %}
        <div class="nav-workspace-menu-divider" role="presentation"></div>
        <a href="/system-settings" class="nav-workspace-menu-row nav-workspace-menu-link" role="menuitem">系统配置</a>
        {% endif %}
    </div>
</div>
<script src="{{ url_for('static', filename='workspace-menu.js') }}" defer></script>

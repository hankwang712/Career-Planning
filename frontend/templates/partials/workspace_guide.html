<dialog id="workspaceSetupGuide" class="ca-setup-guide" aria-labelledby="workspaceSetupTitle">
    <header class="ca-tools-heading">
        <div><h2 id="workspaceSetupTitle">新手引导</h2><p>从设置模型到生成第一份职业报告。</p></div>
        <form method="dialog"><button class="ca-button" aria-label="关闭引导">×</button></form>
    </header>
    <ol class="ca-guide-steps">
        <li><div class="ca-step-number">1</div><div>
            <h3>配置对话模型 <span class="ca-tag required">使用 AI 时必填</span></h3>
            <p>填写 API Key、接口地址和模型名称。岗位浏览和测评可直接使用。技能向量与头像生成按需配置。</p>
            <p id="workspaceGuideModelStatus" class="ca-tag" aria-live="polite">正在检查模型配置…</p>
            <a class="ca-button primary" href="/system-settings" onclick="closeWorkspaceGuide()">去系统配置 →</a>
        </div></li>
        <li><div class="ca-step-number">2</div><div>
            <h3>建立职业画像</h3><p>在岗位探索中选择目标方向，再补充简历、测评或职业访谈。先准备手头已有的资料即可。</p>
            <button type="button" class="ca-button" data-guide-section="jobs">探索岗位 →</button>
            <button type="button" class="ca-button" data-guide-section="profile">完善画像 →</button>
        </div></li>
        <li><div class="ca-step-number">3</div><div>
            <h3>生成第一份职业报告</h3><p>在报告工作区确认目标岗位与已有资料，再发起生成。生成后可查看建议和行动清单。</p>
            <button type="button" class="ca-button" data-guide-section="report">打开报告工作区 →</button>
        </div></li>
    </ol>
    <footer class="ca-tools-heading ca-guide-footer">
        <button type="button" class="ca-button" data-guide-refresh>重新检查模型</button>
        <form method="dialog"><button class="ca-button primary">开始使用</button></form>
    </footer>
</dialog>

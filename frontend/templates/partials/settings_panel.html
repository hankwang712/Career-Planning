<div id="settingsPanel" class="hidden fixed top-14 right-2 z-[200] w-[24rem] overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-2xl" onclick="event.stopPropagation()">
    <div class="gradient-bg px-5 py-4 text-white">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-base">⚙️</span>
                <h3 class="text-sm font-bold">系统 API 配置</h3>
            </div>
            <button type="button" onclick="closeSettingsPanel()" class="text-xl leading-none text-white/60 hover:text-white" aria-label="关闭配置面板">&times;</button>
        </div>
        <p id="settingsPanelUserLabel" class="mt-1 text-xs text-purple-200">未登录</p>
    </div>

    <div class="max-h-[85vh] space-y-4 overflow-y-auto p-4">
        <div>
            <div class="mb-2 flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-widest text-gray-500">已配置的 API</span>
                <span id="settingsAdminAddBtn" class="hidden">
                    <button onclick="openAddProviderForm()" class="rounded-lg px-2 py-0.5 text-xs font-medium text-purple-600 transition-all hover:bg-purple-50 hover:text-purple-800">
                        ＋ 添加
                    </button>
                </span>
            </div>
            <div id="settingsProviderList" class="space-y-2">
                <p class="py-3 text-center text-xs text-gray-400">正在加载...</p>
            </div>
        </div>

        <div id="settingsAddProviderForm" class="hidden space-y-2 rounded-xl border border-purple-100 bg-purple-50 p-3">
            <p class="text-xs font-semibold text-purple-700">添加新 API</p>
            <input id="spfName" type="text" placeholder="名称（如：DeepSeek / OpenRouter）" class="w-full rounded-lg border border-gray-200 px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-purple-300">
            <input id="spfBaseUrl" type="text" placeholder="Base URL（如：https://api.deepseek.com/v1）" class="w-full rounded-lg border border-gray-200 px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-purple-300">
            <input id="spfApiKey" type="password" placeholder="API Key（sk-...）" class="w-full rounded-lg border border-gray-200 px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-purple-300">
            <div class="flex gap-2">
                <button onclick="submitAddProvider()" class="flex-1 rounded-lg bg-purple-600 py-1.5 text-xs font-semibold text-white transition-all hover:bg-purple-700">
                    确认添加
                </button>
                <button onclick="closeAddProviderForm()" class="flex-1 rounded-lg bg-gray-100 py-1.5 text-xs font-semibold text-gray-600 transition-all hover:bg-gray-200">
                    取消
                </button>
            </div>
        </div>

        <p class="pt-1 text-center text-[10px] text-gray-400">
            点击「添加」后可录入代理商的 Base URL 与 API Key；配置后可在各功能里选择对应 Provider 和模型。
        </p>
    </div>
</div>

<div id="modelPickerOverlay" class="hidden fixed inset-0 z-[300] flex items-center justify-center bg-black/40" onclick="closeModelPicker()">
    <div class="w-[26rem] max-w-[95vw] overflow-hidden rounded-2xl bg-white shadow-2xl" onclick="event.stopPropagation()">
        <div class="gradient-bg px-5 py-4 text-white">
            <h3 class="text-sm font-bold">选择 API 和模型</h3>
        </div>
        <div class="space-y-3 p-4">
            <div>
                <label class="mb-1 block text-xs font-medium text-gray-600">API 提供商</label>
                <select id="mpProviderSelect" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" onchange="onPickerProviderChange()">
                    <option value="">-- 请先配置 API --</option>
                </select>
            </div>
            <div>
                <div class="mb-1 flex items-center justify-between">
                    <label class="text-xs font-medium text-gray-600">模型</label>
                    <button id="mpFetchBtn" type="button" onclick="fetchPickerModels()" class="rounded-lg px-2 py-0.5 text-xs font-medium text-purple-600 transition-all hover:bg-purple-50 hover:text-purple-800">
                        获取列表
                    </button>
                </div>
                <select id="mpModelSelect" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
                    <option value="">-- 点击“获取列表” --</option>
                </select>
            </div>
            <p id="mpCurrentHint" class="text-[10px] text-gray-400"></p>
            <div class="flex gap-2 pt-1">
                <button type="button" onclick="confirmModelPicker()" class="flex-1 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 py-2.5 text-sm font-semibold text-white transition-all hover:opacity-90">
                    确认使用
                </button>
                <button type="button" onclick="closeModelPicker()" class="flex-1 rounded-xl bg-gray-100 py-2.5 text-sm font-semibold text-gray-600 transition-all hover:bg-gray-200">
                    取消
                </button>
            </div>
        </div>
    </div>
</div>

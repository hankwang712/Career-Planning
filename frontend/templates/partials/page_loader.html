{# 全局页面加载动画 — 极简、零依赖、首屏即可见。
   放在 <body> 最顶端即可。所有样式内联，避免外部 CSS 未到达时白屏。
#}
<style>
  html.app-loading body { overflow: hidden; }
  #appPageLoader {
    position: fixed;
    inset: 0;
    z-index: 2147483600;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(rgba(23, 35, 59, 0.027) 1px, transparent 1px),
      linear-gradient(90deg, rgba(23, 35, 59, 0.027) 1px, transparent 1px),
      radial-gradient(900px 480px at 82% -12%, rgba(39, 69, 207, 0.06), transparent 68%),
      linear-gradient(180deg, #f6f8fa 0%, #f3f5f7 100%);
    background-size: 28px 28px, 28px 28px, auto, auto;
    color: #17233b;
    font-family: var(--app-font-stack, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif);
    transition: opacity 0.45s ease, visibility 0.45s ease;
    will-change: opacity;
  }
  #appPageLoader[data-state="hidden"] {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #appPageLoader .apl-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    text-align: center;
    transform: translateY(-2vh);
  }
  #appPageLoader .apl-orb {
    position: relative;
    width: 96px;
    height: 96px;
  }
  #appPageLoader .apl-orb::before,
  #appPageLoader .apl-orb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    animation: aplSpin 1.4s cubic-bezier(0.6, 0.05, 0.4, 0.95) infinite;
  }
  #appPageLoader .apl-orb::before {
    border-top-color: #17233b;
    border-right-color: #2745cf;
  }
  #appPageLoader .apl-orb::after {
    inset: 14px;
    border-top-color: #a8823c;
    border-left-color: #7d95ff;
    animation-direction: reverse;
    animation-duration: 1.05s;
  }
  #appPageLoader .apl-orb-core {
    position: absolute;
    inset: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1b2a47 0%, #14213a 100%);
    box-shadow: inset 0 2px 0 #c9a25c, 0 14px 32px rgba(20, 33, 58, 0.3);
    animation: aplPulse 1.6s ease-in-out infinite;
  }
  #appPageLoader .apl-brand {
    font-family: var(--app-editorial-stack, "Noto Serif SC", "Songti SC", serif);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    color: #17233b;
  }
  #appPageLoader .apl-tip {
    font-size: 0.78rem;
    color: #5c6b84;
    letter-spacing: 0.06em;
  }
  #appPageLoader .apl-bar {
    width: 180px;
    height: 3px;
    border-radius: 999px;
    background: rgba(23, 35, 59, 0.1);
    overflow: hidden;
    position: relative;
  }
  #appPageLoader .apl-bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -40%;
    height: 100%;
    width: 40%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, #2745cf, #a8823c, transparent);
    animation: aplSlide 1.4s ease-in-out infinite;
  }
  @keyframes aplSpin {
    to { transform: rotate(360deg); }
  }
  @keyframes aplPulse {
    0%, 100% { transform: scale(1); opacity: 0.92; }
    50% { transform: scale(0.86); opacity: 0.7; }
  }
  @keyframes aplSlide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #appPageLoader .apl-orb::before,
    #appPageLoader .apl-orb::after,
    #appPageLoader .apl-orb-core,
    #appPageLoader .apl-bar::after {
      animation: none;
    }
  }
</style>
<div id="appPageLoader" role="status" aria-live="polite" aria-label="页面加载中">
  <div class="apl-stage">
    <div class="apl-orb">
      <div class="apl-orb-core"></div>
    </div>
    <div class="apl-brand" data-apl-brand>智 航 生 涯</div>
    <div class="apl-bar"></div>
    <div class="apl-tip" data-apl-tip>正在为你准备工作台 · Loading workspace</div>
  </div>
</div>
<script>
  (function () {
    var html = document.documentElement;
    html.classList.add("app-loading");
    var loader = document.getElementById("appPageLoader");
    if (!loader) return;
    var autoHideTimer = null;
    var fallbackTimer = null;
    var defaultBrand = "智 航 生 涯";
    var defaultTip = "正在为你准备工作台 · Loading workspace";
    function setText(opts) {
      opts = opts || {};
      var brandEl = loader.querySelector("[data-apl-brand]");
      var tipEl = loader.querySelector("[data-apl-tip]");
      if (brandEl) brandEl.textContent = opts.brand || defaultBrand;
      if (tipEl) tipEl.textContent = opts.tip || defaultTip;
    }
    function showLoader(opts) {
      opts = opts || {};
      if (autoHideTimer) { clearTimeout(autoHideTimer); autoHideTimer = null; }
      if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
      setText(opts);
      loader.removeAttribute("data-state");
      html.classList.add("app-loading");
      if (typeof opts.timeoutMs === "number" && opts.timeoutMs > 0) {
        fallbackTimer = setTimeout(hideLoader, opts.timeoutMs);
      }
    }
    function hideLoader() {
      if (loader.getAttribute("data-state") === "hidden") return;
      loader.setAttribute("data-state", "hidden");
      html.classList.remove("app-loading");
      if (autoHideTimer) { clearTimeout(autoHideTimer); autoHideTimer = null; }
      if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    }
    function authCheckingActive() {
      return !!(document.body && document.body.classList.contains("auth-checking"));
    }
    function attemptAutoHide() {
      if (!authCheckingActive()) {
        hideLoader();
        return;
      }
      var observer = new MutationObserver(function () {
        if (!authCheckingActive()) {
          observer.disconnect();
          hideLoader();
        }
      });
      observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });
    }
    window.__hidePageLoader = hideLoader;
    window.__showPageLoader = showLoader;
    if (document.readyState === "complete") {
      requestAnimationFrame(attemptAutoHide);
    } else {
      window.addEventListener("load", function () {
        requestAnimationFrame(function () {
          autoHideTimer = setTimeout(attemptAutoHide, 120);
        });
      });
    }
    fallbackTimer = setTimeout(hideLoader, 9000);
  })();
</script>

<div id="assessmentModal" class="assessment-modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="assessmentModalTitle" onclick="handleAssessmentOverlayClick(event)">
    <div class="assessment-modal-shell">
        <div class="assessment-modal-header">
            <div>
                <p id="assessmentModalEyebrow" class="assessment-modal-eyebrow">Assessment Center</p>
                <h3 id="assessmentModalTitle" class="assessment-modal-title">用户画像测评中心</h3>
                <p id="assessmentModalSubtitle" class="assessment-modal-subtitle">任选一个测评开始，系统会自动记录进度并同步结果卡片。</p>
            </div>
            <div class="assessment-modal-toolbar">
                <button type="button" class="assessment-toolbar-btn" onclick="showAssessmentHome()">选择测评</button>
                <button type="button" class="assessment-toolbar-btn" onclick="restartAssessmentFlow()">重新开始</button>
                <button type="button" class="assessment-toolbar-btn danger" onclick="closeAssessmentModal()">关闭</button>
            </div>
        </div>

        <div class="assessment-modal-body">
            <aside class="assessment-modal-side">
                <div class="assessment-side-card">
                    <p class="assessment-mini-label">当前状态</p>
                    <div id="assessmentModalStateText" class="assessment-side-state">等待选择测评</div>
                    <div id="assessmentModalProgressText" class="assessment-side-progress">0 / 0</div>
                    <div id="assessmentPetSlot" class="assessment-pet-slot" aria-live="polite"></div>
                </div>

                <div class="assessment-side-card">
                    <p class="assessment-mini-label">进度轨迹</p>
                    <div id="assessmentModalProgressRail" class="assessment-progress-rail"></div>
                </div>

                <div id="assessmentConfigPanel" class="assessment-config-panel hidden"></div>
            </aside>

            <section class="assessment-modal-main">
                <div id="assessmentModalContent"></div>
            </section>
        </div>
    </div>
</div>

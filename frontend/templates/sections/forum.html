<section id="forum" class="hidden fade-in">
  <div class="forum-shell">
    <header class="forum-header">
      <div class="forum-heading">
        <p class="forum-eyebrow">THE CAREER COMMONS</p>
        <h2>Offer 茶水间<span class="forum-heading-mark" aria-hidden="true">☕</span></h2>
        <p class="forum-intro">面经、简历、选岗与职场日常。把问题说出来，也把经验留下来。</p>
        <div class="forum-overview" aria-label="社区概览">
          <span><strong id="forumThreadCount">0</strong> 个讨论</span>
          <span><strong id="forumTodayCount">0</strong> 条新帖</span>
          <span><strong id="forumActiveUsers">0</strong> 位参与者</span>
          <span><strong id="forumUnansweredCount">0</strong> 个问题待回复</span>
        </div>
      </div>
      <button type="button" class="forum-primary-button" onclick="showForumView('compose')"><span aria-hidden="true">＋</span> 发起讨论</button>
    </header>

    <div class="forum-layout">
      <aside class="forum-sidebar">
        <div class="forum-sidebar-card"><h3>讨论板块</h3><nav id="forumBoardFilters" aria-label="讨论板块"></nav></div>
        <div class="forum-sidebar-card"><div class="forum-sidebar-heading"><h3>大家在聊</h3><button type="button" class="forum-text-button" onclick="ensureCommunityForumLoaded(true)">刷新</button></div><div id="forumHotTags" class="forum-tags"></div></div>
        <p class="forum-visibility-note">帖子对登录用户公开。<br>测评、简历和报告不会在这里公开。</p>
      </aside>

      <main class="forum-main">
        <div id="forumListView">
          <div class="forum-toolbar">
            <label class="forum-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="forumSearchInput" type="search" aria-label="搜索讨论" placeholder="搜一搜你关心的问题"></label>
            <div id="forumSortFilters" class="forum-sort" role="group" aria-label="讨论排序"></div>
          </div>
          <div class="forum-feed-heading"><h3 id="forumCurrentBoard">全部讨论</h3><span id="forumListSummary">正在加载…</span></div>
          <div id="forumThreadList" class="forum-thread-list"></div>
        </div>

        <div id="forumDetailView" class="hidden">
          <button type="button" class="forum-back-button" onclick="showForumView('list')">← 返回讨论</button>
          <article class="forum-detail-surface"><span id="forumDetailBadge" class="forum-board-badge">分区</span><div id="forumThreadDetail"></div></article>
        </div>

        <div id="forumComposeView" class="hidden">
          <button type="button" class="forum-back-button" onclick="showForumView('list')">← 返回讨论</button>
          <form id="forumComposerCard" class="forum-composer" onsubmit="event.preventDefault(); submitCommunityPost();">
            <p class="forum-eyebrow">START A CONVERSATION</p><h3>有什么想聊的？</h3><p class="forum-composer-copy">一个具体的问题，一段真实的经历，都可以成为讨论的开始。</p>
            <label for="forumPostTitle">讨论标题<input id="forumPostTitle" type="text" maxlength="80" minlength="4" required placeholder="比如：暑期实习，先补项目还是先刷题？"></label>
            <div class="forum-composer-fields">
              <label for="forumPostBoard">选择板块<select id="forumPostBoard"><option>面经互助</option><option>简历门诊</option><option>实习内推</option><option>选岗热议</option><option>职场日常</option></select></label>
              <label for="forumPostTags">标签<span class="forum-field-optional">选填</span><input id="forumPostTags" type="text" maxlength="48" placeholder="用逗号分隔，例如：校招, 项目经历"></label>
            </div>
            <label for="forumPostContent">展开聊聊<textarea id="forumPostContent" rows="8" maxlength="2400" minlength="10" required placeholder="介绍一下你的背景、目前的进展，以及最想听听大家建议的地方。"></textarea></label>
            <div class="forum-composer-footer"><p>发布后所有登录用户可见，请勿填写私密信息。</p><div><button type="button" class="forum-secondary-button" onclick="showForumView('list')">取消</button><button type="submit" class="forum-primary-button">发布讨论</button></div></div>
          </form>
        </div>
      </main>
    </div>
  </div>
</section>

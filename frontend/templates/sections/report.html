<section id="report" class="w-full max-w-[1600px] mx-auto px-3 sm:px-5 lg:px-6 hidden fade-in">
    <div class="report-launch-page">
        <div class="report-launch-hero">
            <div>
                <p class="report-launch-kicker">一步一步，找到下一站</p>
                <h2 class="report-launch-title">职业生涯发展报告生成台</h2>
            </div>
            <div class="report-launch-actions">
                <button id="reportLaunchBtn" type="button" class="report-launch-primary" disabled onclick="reportWizardPrimaryAction()">启动多智能体</button>
                <button id="reportCancelBtn" type="button" class="report-launch-danger hidden" onclick="cancelCareerReportGeneration()">停止生成</button>
                <button type="button" class="report-launch-secondary" onclick="window.openUserCenterPage ? openUserCenterPage('report-workspace') : (window.location.href='/user-center#report-workspace')">查看报告中心</button>
            </div>
        </div>

        <nav class="report-stage-nav" aria-label="报告生成阶段">
            <button type="button" data-report-step="2" disabled onclick="showReportWizardStage(2)"><span class="report-step-number">01</span><span><strong>设定方向</strong><small>目标岗位与求职偏好</small></span><span class="report-step-check" aria-hidden="true">✓</span></button>
            <span class="report-step-connector" aria-hidden="true"></span>
            <button type="button" data-report-step="3" disabled onclick="showReportWizardStage(3)"><span class="report-step-number">02</span><span><strong>Agent 协作</strong><small>一起完成你的职业报告</small></span><span class="report-step-check" aria-hidden="true">✓</span></button>
        </nav>

        <p id="reportLaunchFeedback" class="report-launch-feedback" role="status" aria-live="polite" hidden></p>

        <section id="reportResumeNotice" class="report-resume-notice report-wizard-stage" aria-labelledby="reportResumeNoticeTitle">
            <div>
                <h3 id="reportResumeNoticeTitle" aria-live="polite">正在检查简历</h3>
                <p id="reportResumeNoticeDetail">规划报告使用个人中心保存的简历。</p>
            </div>
            <a id="reportResumeEditorLink" href="{{ url_for('resume_editor.index', from_report=1) }}" class="report-launch-primary" hidden>前往我的简历 <span aria-hidden="true">→</span></a>
            <button id="reportResumeRetry" type="button" class="report-launch-secondary" onclick="refreshReportResumePanel()" hidden>重试</button>
        </section>

        <form id="reportWorkflowInput" class="report-workflow-form report-wizard-stage" hidden onsubmit="event.preventDefault(); startCareerReportGeneration();">
            <div class="report-input-heading"><span class="report-input-step">01 · 分析目标</span><h3>填写目标与偏好</h3></div>
            <p class="report-stage-description">给探索一个方向，剩下的交给你的 Agent 团队。</p>
            <label>目标岗位或方向（每行一个，最多五个）
                <textarea id="reportWorkflowTargets" rows="2" maxlength="1500" placeholder="例如：大模型应用开发工程师" required></textarea>
            </label>
            <label>求职偏好与限制
                <textarea id="reportWorkflowPreferences" rows="2" maxlength="4500" placeholder="例如：希望在杭州或上海工作，其他限制可留空"></textarea>
            </label>
            <div class="report-availability-fields">
                <label>什么时候可以开始实习？
                    <select id="reportWorkflowArrival" required>
                        <option value="" disabled selected>选择到岗时间</option>
                        <option value="now">随时到岗</option><option value="one_week">一周内</option>
                        <option value="two_weeks">两周内</option><option value="one_month">一个月内</option>
                        <option value="winter">寒假开始</option><option value="summer">暑假开始</option>
                        <option value="undecided">尚未确定</option>
                    </select>
                </label>
                <label>每周可以实习几天？
                    <select id="reportWorkflowDays" required>
                        <option value="" disabled selected>选择每周天数</option>
                        <option value="1">1 天</option><option value="2">2 天</option><option value="3">3 天</option>
                        <option value="4">4 天</option><option value="5">5 天</option><option value="6">6 天</option>
                        <option value="7">7 天</option><option value="0">尚未确定</option>
                    </select>
                </label>
                <label>招聘信息发布起始日期（选填）
                    <input id="reportWorkflowPublishedAfter" type="date" aria-describedby="reportPublishedAfterHint">
                    <small id="reportPublishedAfterHint">查找该日期起发布的招聘信息，发布日期未核实的线索会单独标注。</small>
                </label>
            </div>
            <div class="report-stage-footer"><span id="reportResumeSourceLabel"></span><button id="reportStageStart" type="submit" class="report-launch-primary">启动多智能体 <span aria-hidden="true">↗</span></button></div>
        </form>

        <section id="reportExecutionPanel" class="report-wizard-stage report-execution-panel" hidden aria-label="第二阶段：多智能体协作">
        <div class="report-execution-intro"><div><span class="report-input-step">02 · 多智能体协作</span><h3 id="reportExecutionTitle">你的职业探索团队，正在就位。</h3><p>每位 Agent 专注一项任务，右上角的对话气泡会显示当前进展。</p></div><span class="report-team-mark" aria-hidden="true">✦</span></div>
        <div id="reportStatus" class="report-launch-status">
            <div>
                <p id="reportStatusTitle" class="report-launch-status-title">等待启动多智能体流程</p>
                <p id="reportStatusHint" class="report-launch-status-copy">点击“启动生成”创建职业报告。</p>
            </div>
            <div class="report-launch-status-meta">
                <span>更新时间</span>
                <strong id="reportGeneratedTime">--</strong>
            </div>
        </div>

        <div id="reportWorkflowReview" class="report-review-panel hidden" aria-live="polite"></div>

        <div class="report-workflow-section" aria-label="多智能体协作流">
            <div class="report-workflow-header">
                <div class="report-workflow-title">
                    <div class="report-workflow-title-icon" aria-hidden="true">🤖</div>
                    <div>
                        <h3 class="report-workflow-heading">AGENT WORKFLOW</h3>
                        <span class="report-workflow-sub">多智能体协作流</span>
                    </div>
                </div>
                <div class="report-workflow-legend">
                    <span><span class="legend-dot completed"></span>已完成</span>
                    <span><span class="legend-dot active"></span>处理中</span>
                    <span><span class="legend-dot failed"></span>错误</span>
                    <span><span class="legend-dot pending"></span>待启动</span>
                </div>
            </div>
            <div id="reportAgentMap" class="report-agent-map"></div>
        </div>
        </section>
    </div>
</section>

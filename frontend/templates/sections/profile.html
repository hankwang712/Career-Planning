<section id="profile" class="max-w-[1440px] mx-auto px-4 sm:px-5 lg:px-6 hidden fade-in">
    <header class="assessment-center-heading">
        <div>
            <p class="assessment-center-eyebrow">ASSESSMENTS</p>
            <h2>测评中心</h2>
            <p>从六个测评中任选一项，按自己的节奏了解自己。</p>
        </div>
        <span class="assessment-center-count">6 项测评 · 随时开始</span>
    </header>
    <div class="assessment-center-layout">
        <div id="assessmentTestGrid" class="assessment-center-grid" aria-label="全部六项测评"></div>
        <aside class="assessment-center-history" aria-labelledby="assessmentHistoryTitle">
            <div class="assessment-center-history-head">
                <div><p class="assessment-center-eyebrow">YOUR HISTORY</p><h3 id="assessmentHistoryTitle">测评记录</h3></div>
                <span id="assessmentHistoryCount" class="assessment-center-history-count">0 条</span>
            </div>
            <p class="assessment-center-history-note">仅记录完成时间与简要结果，保存在当前浏览器。</p>
            <label class="assessment-center-filter"><span>筛选测评</span><select id="assessmentHistoryFilter" aria-controls="assessmentHistoryList"><option value="all">全部测评</option></select></label>
            <div id="assessmentHistoryList" class="assessment-center-history-list" aria-live="polite"></div>
        </aside>
    </div>
</section>

        <section id="dashboard" class="cs-home cs-home-concierge max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 fade-in">
            <section class="dashboard-workspace-overview" aria-labelledby="dashboardWorkspaceTitle">
                <div class="dashboard-workspace-main">
                    <h2 id="dashboardWorkspaceTitle">职业工作台</h2>
                    <form class="dashboard-job-search" action="{{ url_for('recruitment.page') }}" role="search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                        <input name="q" type="search" maxlength="120" placeholder="按岗位、公司或地点搜索" aria-label="搜索岗位" autocomplete="off" required>
                        <button type="submit">搜索</button>
                    </form>
                    <div class="dashboard-workspace-actions">
                        <button type="button" onclick="showSection('profile')">继续测评 <span aria-hidden="true">→</span></button>
                        <button type="button" onclick="TourGuide.start()">使用引导</button>
                    </div>
                </div>
                <dl class="dashboard-workspace-metrics" aria-label="当前进度">
                    <div><dt>画像进度</dt><dd id="profileCompletionRate">—</dd></div>
                    <div><dt>推荐岗位</dt><dd id="exploredJobsCount">—</dd></div>
                    <div><dt>待完成任务</dt><dd id="pendingTaskCount">—</dd></div>
                </dl>
            </section>

            <section class="dashboard-workspace-tools" aria-labelledby="careerProcessTitle">
                <h2 id="careerProcessTitle">求职工具</h2>
                <div class="dashboard-tool-grid">
                    <button type="button" class="dashboard-tool" data-tone="profile" onclick="showSection('profile')">
                        <span class="dashboard-tool-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></svg>
                        </span>
                        <span>测评中心</span><span class="dashboard-tool-arrow" aria-hidden="true">→</span>
                    </button>
                    <a class="dashboard-tool" data-tone="jobs" href="{{ url_for('recruitment.page') }}">
                        <span class="dashboard-tool-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                        </span>
                        <span>岗位探索</span><span class="dashboard-tool-arrow" aria-hidden="true">→</span>
                    </a>
                    <button type="button" class="dashboard-tool" data-tone="report" onclick="showSection('report')">
                        <span class="dashboard-tool-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 3h7l4 4v14H6V3h1Zm7 0v5h4M9 12h6m-6 4h6"/></svg>
                        </span>
                        <span>规划报告</span><span class="dashboard-tool-arrow" aria-hidden="true">→</span>
                    </button>
                </div>
            </section>

            <!-- 职业发展路径 -->
            <section class="cs-product-section hidden">
                <div class="cs-product-section-header">
                    <div>
                        <h3>职业发展路径</h3>
                        <p>从学生到行业专家的完整成长阶梯</p>
                    </div>
                    <button type="button" class="cs-product-section-link" onclick="showSection('report')">自定义路径 →</button>
                </div>

                <div class="cs-product-path-track">
                    <div class="cs-product-path-line"></div>
                    <div class="cs-product-path-node is-done"><span>✓</span><strong>学生</strong><small>Student</small><em>已完成</em></div>
                    <div class="cs-product-path-node is-done"><span>✓</span><strong>本科入学</strong><small>Undergrad</small><em>已完成</em></div>
                    <div class="cs-product-path-node is-done"><span>✓</span><strong>实习经历</strong><small>Internship</small><em>已完成</em></div>
                    <div class="cs-product-path-node is-current"><span></span><strong>首次就业</strong><small>First Job</small><em>进行中</em></div>
                    <div class="cs-product-path-node"><span></span><strong>职业晋升</strong><small>Promotion</small><em>待完成</em></div>
                    <div class="cs-product-path-node"><span></span><strong>行业专家</strong><small>Expert</small><em>待完成</em></div>
                    <div class="cs-product-path-node"><span></span><strong>专业从业者</strong><small>Professional</small><em>长期目标</em></div>
                </div>
            </section>

            <!-- 核心功能 -->
            <section class="cs-product-section hidden">
                <div class="cs-product-section-header is-center">
                    <div>
                        <h3>核心功能</h3>
                        <p>全方位赋能你的职业规划之旅</p>
                    </div>
                </div>

                <div class="cs-product-feature-grid">
                    <button type="button" class="cs-product-feature-card" onclick="showSection('profile')">
                        <div class="cs-product-feature-icon" style="--icon-bg:#eaf0f7;--icon-color:#355b82">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/><path d="m12 2 8 10H4l8-10z"/></svg>
                        </div>
                        <strong>多维能力测评</strong>
                        <span>Multi-Dimensional Assessment</span>
                        <p>整合基础信息、简历、访谈和测评结果，沉淀可解释的能力画像。</p>
                        <em>开始测评 →</em>
                    </button>
                    <button type="button" class="cs-product-feature-card" onclick="showSection('report')">
                        <div class="cs-product-feature-icon" style="--icon-bg:#eff4fa;--icon-color:#5c7692">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </div>
                        <strong>职业发展规划</strong>
                        <span>Career Development Plan</span>
                        <p>生成短期补齐、中期进阶和长期目标的行动路线。</p>
                        <em>查看规划 →</em>
                    </button>
                    <button type="button" class="cs-product-feature-card" onclick="showSection('jobs')">
                        <div class="cs-product-feature-icon" style="--icon-bg:#e6edf5;--icon-color:#526b83">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        </div>
                        <strong>岗位探索</strong>
                        <span>Role Exploration</span>
                        <p>浏览重点岗位、技能要求、薪资区间和成长路径。</p>
                        <em>立即探索 →</em>
                    </button>
                    <button type="button" class="cs-product-feature-card" onclick="showSection('dashboard')">
                        <div class="cs-product-feature-icon" style="--icon-bg:#dde7f1;--icon-color:#263c56">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                        </div>
                        <strong>数据看板</strong>
                        <span>Analytics Dashboard</span>
                        <p>跟踪探索进度、画像成熟度、匹配结果和报告状态。</p>
                        <em>刷新数据 →</em>
                    </button>
                </div>
            </section>

            <!-- 新闻区 -->
            {% include "sections/dashboard_career_news.html" %}
        </section>

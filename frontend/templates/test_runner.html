<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试作答页 | 智航生涯</title>
    {% include "partials/head_fonts.html" %}
    <script>
      window.__API_BASE__ = window.__API_BASE__ || "";
    </script>
    <script src="{{ url_for('static', filename='return-nav.js') }}"></script>
    {{ vite_asset_tags('src/entries/test-runner.js') }}
    <link rel="stylesheet" href="{{ url_for('static', filename='assessment-experience.css') }}">
</head>
<body class="tr-page" data-page="test-runner">
    {% include "partials/page_loader.html" %}
    <div class="tr-layout">
        <aside class="tr-sidebar">
            <a class="tr-brand" href="{{ url_for('index') }}">
                <div class="tr-brand-mark">
                    <img src="{{ url_for('static', filename='trueyouteller/brand/trueyouteller_logo-removebg.png') }}" alt="TrueYouTeller 品牌标识">
                </div>
                <div class="tr-brand-copy">
                    <strong>智航生涯</strong>
                    <span>扩展测试中心</span>
                </div>
            </a>

            <nav class="tr-nav" aria-label="测试类型导航">
                <button type="button" class="tr-nav-link active" data-test="deep">深层 MBTI</button>
                <button type="button" class="tr-nav-link" data-test="friends">老友记角色</button>
                <button type="button" class="tr-nav-link" data-test="insideout">头脑特工队</button>
                <button type="button" class="tr-nav-link" data-test="sbti">SBTI 人格扩展</button>
            </nav>

            <div class="tr-sidebar-footer">
                <a class="tr-footer-link" href="/main.html#profile">返回主界面</a>
            </div>
        </aside>

        <div class="tr-main">
            <header class="tr-topbar">
                <div class="tr-topbar-left">
                    <a class="tr-back-link" href="/main.html#profile">返回主界面</a>
                    <div>
                        <p class="tr-topbar-kicker">测试作答区</p>
                        <h1 id="tsPageTitle">深层 MBTI 测试作答页</h1>
                    </div>
                </div>
                <div class="tr-topbar-actions">
                    <span id="currentUserLabel" class="topbar-pill">未登录</span>
                    <button id="logoutBtn" type="button" class="topbar-text-btn">退出</button>
                    <button type="button" class="topbar-avatar-btn" id="tsAvatarBtn" title="个人中心" aria-label="打开个人中心">
                        <span id="currentUserAvatar">人</span>
                    </button>
                </div>
            </header>

            <main class="tr-content">
                <section class="tr-surface ts-workspace" aria-label="测评作答">
                    <div class="ts-quiz-shell">
                        <div class="ts-hero">
                            <img id="tsCoverImage" src="{{ url_for('static', filename='trueyouteller/brand/trueyouteller.png') }}" alt="测试封面图">
                            <div class="ts-hero-copy">
                                <h3 id="tsHeroTitle">进入当前测试</h3>
                                <p id="tsHeroDesc">点击选项后会自动记录答案，并在完成后跳转到对应的完整结果页。</p>
                                <p id="tsMetaLine" class="ts-meta-line"></p>
                            </div>
                            <div class="ts-tools">
                                <button id="tsViewResultBtn" type="button" class="tr-btn ghost">查看上次结果</button>
                                <button id="tsRestartBtn" type="button" class="tr-btn ghost">重新开始</button>
                            </div>
                        </div>

                        <div class="ts-progress-wrap">
                            <div class="ts-progress-head">
                                <strong id="tsProgressText">进度 0 / 0</strong>
                                <label class="ax-auto-label"><input type="checkbox" id="tsAutoAdvance" checked>自动下一题</label>
                            </div>
                            <div class="ts-progress-track" role="progressbar" aria-label="作答进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                                <div id="tsProgressFill" class="ts-progress-fill"></div>
                            </div>
                            <div class="ts-progress-caption">
                                <span id="tsAnsweredText">已作答 0 / 0</span>
                                <span>按日常感受选择即可</span>
                            </div>
                        </div>

                        <article class="ts-question-card">
                            <p id="tsQuestionNo" class="ts-question-no">第 1 题 / 共 0 题</p>
                            <h3 id="tsQuestionText" class="ts-question-text">题目加载中...</h3>
                            <div id="tsOptions" class="ts-options"></div>
                        </article>

                        <div class="ts-nav-row">
                            <button id="tsPrevBtn" type="button" class="tr-btn ghost">← 上一题</button>
                            <div class="ts-nav-forward">
                                <button id="tsNextBtn" type="button" class="tr-btn primary">下一题 →</button>
                                <button id="tsSubmitBtn" type="button" class="tr-btn primary" hidden>查看测评结果 →</button>
                            </div>
                        </div>
                        <p id="tsHintLine" class="ts-hint-line"></p>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="{{ url_for('static', filename='assessment-center.js') }}"></script>
    <script src="{{ url_for('static', filename='deep-test-hub.js') }}"></script>
    <script src="{{ url_for('static', filename='test-runner.js') }}"></script>
</body>
</html>

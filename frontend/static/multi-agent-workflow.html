<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职业生涯发展报告生成台 - 3D Agent Collaboration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1e293b;
            min-height: 100vh;
        }
        .container { max-width: 1500px; margin: 0 auto; padding: 24px; }
        
        .header {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #f472b6, #a78bfa, #60a5fa, #34d399, #fbbf24);
        }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .header-label {
            font-size: 11px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: #a78bfa; margin-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }
        .header-label::before { content: '✨'; font-size: 14px; }
        .header h1 { font-size: 26px; font-weight: 800; color: #1e293b; }
        .header-actions { display: flex; gap: 12px; }
        .btn {
            padding: 10px 20px; border-radius: 14px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; border: 2px solid;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff; border-color: #8b5cf6;
            box-shadow: 0 4px 0 #7c3aed, 0 8px 15px rgba(139,92,246,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #7c3aed; }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #7c3aed; }
        .btn-secondary {
            background: #fff; color: #64748b; border-color: #e2e8f0;
            box-shadow: 0 4px 0 #cbd5e1, 0 8px 15px rgba(0,0,0,0.05);
        }
        .btn-secondary:hover { transform: translateY(-2px); border-color: #a78bfa; }
        .header-desc { font-size: 13px; color: #94a3b8; line-height: 1.6; }
        
        .status-bar {
            background: #fff; border: 2px solid #fecaca; border-radius: 16px;
            padding: 16px 24px; margin-bottom: 24px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 0 #fca5a5;
        }
        .status-left { display: flex; align-items: center; gap: 16px; }
        .status-icon {
            width: 44px; height: 44px; background: #fef2f2; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #fecaca; font-size: 20px;
        }
        .status-text h3 { font-size: 14px; font-weight: 700; color: #ef4444; margin-bottom: 4px; }
        .status-text p { font-size: 12px; color: #94a3b8; }
        .status-time { text-align: right; }
        .status-time .label { font-size: 11px; color: #cbd5e1; margin-bottom: 4px; }
        .status-time .time { font-size: 13px; color: #64748b; font-weight: 600; font-family: monospace; }
        
        .workflow-section {
            background: #ffffff; border: 2px solid #e2e8f0;
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 0 #e2e8f0, 0 10px 30px rgba(0,0,0,0.04);
        }
        .workflow-header {
            padding: 20px 28px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 2px solid #f1f5f9; background: #fafbfc;
        }
        .workflow-title { display: flex; align-items: center; gap: 12px; }
        .workflow-title-icon {
            width: 36px; height: 36px; background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            border: 2px solid #fcd34d; font-size: 18px;
        }
        .workflow-title h2 { font-size: 15px; font-weight: 700; color: #1e293b; }
        .workflow-title span { font-size: 12px; color: #94a3b8; }
        .legend { display: flex; gap: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; font-weight: 500; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid; }
        .legend-dot.completed { background: #34d399; border-color: #059669; }
        .legend-dot.active { background: #fbbf24; border-color: #d97706; }
        .legend-dot.pending { background: #e2e8f0; border-color: #cbd5e1; }
        
        .workflow-canvas {
            position: relative;
            min-height: 750px;
            background: #fafbfc;
        }
        
        #connectionsCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .agents-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 260px);
            gap: 16px 24px;
            padding: 40px 30px;
            align-items: center;
            justify-items: center;
        }
        
        .agent-card {
            position: relative;
            width: 220px;
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 24px;
            padding: 14px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 #e2e8f0;
            cursor: pointer;
        }
        .agent-card:hover {
            transform: translateY(-8px) rotate(-1deg);
            box-shadow: 0 12px 0 var(--shadow, #e2e8f0);
        }
        .agent-card.completed { --shadow: #a7f3d0; border-color: #34d399; }
        .agent-card.active { --shadow: #fde68a; border-color: #fbbf24; animation: gentleBounce 2s infinite; }
        .agent-card.pending { --shadow: #e2e8f0; border-color: #e2e8f0; opacity: 0.65; }
        
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        .agent-badge {
            position: absolute;
            top: -10px; left: -10px;
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #fff;
            border: 3px solid #fff;
            box-shadow: 0 3px 8px rgba(124,58,237,0.3);
            z-index: 5;
        }
        
        .status-badge {
            position: absolute;
            top: -6px; right: -6px;
            font-size: 9px; font-weight: 700;
            padding: 3px 8px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.5px;
            border: 2px solid; z-index: 5;
        }
        .status-badge.completed { background: #d1fae5; color: #059669; border-color: #34d399; }
        .status-badge.active { background: #fef3c7; color: #d97706; border-color: #fbbf24; animation: pulseBadge 1.5s infinite; }
        @keyframes pulseBadge { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .status-badge.pending { background: #f1f5f9; color: #94a3b8; border-color: #cbd5e1; }
        
        .agent-3d-container {
            width: 120px; height: 120px;
            margin: 4px auto 8px;
            position: relative;
        }
        .agent-3d-container canvas {
            width: 100% !important;
            height: 100% !important;
            border-radius: 16px;
        }
        
        .agent-card.hub {
            width: 240px;
            --shadow: #c4b5fd;
            border-color: #a78bfa;
            background: linear-gradient(180deg, #faf5ff, #fff);
        }
        .agent-card.hub .agent-badge {
            background: linear-gradient(135deg, #f472b6, #ec4899);
        }
        .agent-card.hub .agent-3d-container {
            width: 140px; height: 140px;
        }
        
        .agent-name { font-size: 13px; font-weight: 800; color: #1e293b; margin-bottom: 2px; }
        .agent-role { font-size: 9px; color: #94a3b8; line-height: 1.4; font-weight: 500; }
        
        .agent-metrics {
            display: flex; justify-content: center; gap: 4px;
            margin-top: 8px; flex-wrap: wrap;
        }
        .metric-tag {
            font-size: 8px; font-weight: 700;
            padding: 2px 6px; border-radius: 8px;
            border: 1.5px solid;
        }
        .metric-tag.green { background: #d1fae5; color: #059669; border-color: #6ee7b7; }
        .metric-tag.blue { background: #dbeafe; color: #2563eb; border-color: #93c5fd; }
        .metric-tag.pink { background: #fce7f3; color: #db2777; border-color: #f9a8d4; }
        .metric-tag.yellow { background: #fef3c7; color: #d97706; border-color: #fcd34d; }
        .metric-tag.gray { background: #f1f5f9; color: #94a3b8; border-color: #cbd5e1; }
        
        .loading-bar {
            height: 4px; background: #fef3c7; border-radius: 2px;
            margin-top: 6px; overflow: hidden; border: 1px solid #fde68a;
        }
        .loading-bar-fill {
            height: 100%; border-radius: 2px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
            background-size: 200% 100%;
            animation: loadingSweep 2s ease-in-out infinite;
        }
        @keyframes loadingSweep {
            0% { width: 0%; background-position: 0% 0%; }
            50% { width: 70%; background-position: 100% 0%; }
            100% { width: 100%; background-position: 200% 0%; }
        }
        
        .agent-card:nth-child(1) { grid-column: 1; grid-row: 2; }
        .agent-card:nth-child(2) { grid-column: 2; grid-row: 1; }
        .agent-card:nth-child(3) { grid-column: 2; grid-row: 3; }
        .agent-card:nth-child(4) { grid-column: 3; grid-row: 2; }
        .agent-card:nth-child(5) { grid-column: 4; grid-row: 1; }
        .agent-card:nth-child(6) { grid-column: 4; grid-row: 3; }
        .agent-card:nth-child(7) { grid-column: 5; grid-row: 2; }
        
        @media (max-width: 1300px) {
            .agents-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: auto;
            }
            .agent-card { grid-column: auto !important; grid-row: auto !important; }
        }
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header { padding: 20px; }
            .header h1 { font-size: 20px; }
            .header-top { flex-direction: column; gap: 16px; }
            .agents-grid { grid-template-columns: 1fr; padding: 20px; }
            .agent-card { width: 100%; }
            .legend { display: none; }
        }
    </style>
    <link rel="stylesheet" href="/static/app-cursor.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div>
                    <div class="header-label">CAREER REPORT PIPELINE</div>
                    <h1>🎯 职业生涯发展报告生成台</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="restartGen()">🔄 重新生成</button>
                    <button class="btn btn-secondary">📋 查看报告中心</button>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div class="status-left">
                <div class="status-icon">⏸️</div>
                <div class="status-text">
                    <h3>本次生成已停止</h3>
                    <p>旧任务已停止，不会写入报告；可以重新启动一次新的多智能体生成。</p>
                </div>
            </div>
            <div class="status-time">
                <div class="label">更新时间</div>
                <div class="time">2026/4/11 23:07:52</div>
            </div>
        </div>
        
        <div class="workflow-section">
            <div class="workflow-header">
                <div class="workflow-title">
                    <div class="workflow-title-icon">🤖</div>
                    <div>
                        <h2>AGENT WORKFLOW</h2>
                        <span>多智能体 3D 协作流</span>
                    </div>
                </div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot completed"></div><span>已完成</span></div>
                    <div class="legend-item"><div class="legend-dot active"></div><span>处理中</span></div>
                    <div class="legend-item"><div class="legend-dot pending"></div><span>待启动</span></div>
                </div>
            </div>
            
            <div class="workflow-canvas" id="workflowCanvas">
                <canvas id="connectionsCanvas"></canvas>
                <div class="agents-grid" id="agentsGrid"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const agents = [
            { id: '01', name: '画像输入', role: 'Profile Intake', status: 'completed', type: 'profile', metrics: [{text:'✅ 数据已录入',cls:'green'}] },
            { id: '02', name: '行业分析师', role: 'Industry Analyst', status: 'pending', type: 'analyst', metrics: [{text:'💤 等待中',cls:'gray'}] },
            { id: '03', name: '简历证据分析官', role: 'Resume Evidence', status: 'pending', type: 'evidence', metrics: [{text:'💤 等待中',cls:'gray'}] },
            { id: '04', name: '职业定位顾问', role: 'Career Positioning', status: 'pending', type: 'advisor', isHub: true, metrics: [{text:'💤 等待中',cls:'gray'}] },
            { id: '05', name: '能力评估官', role: 'Competency Assessor', status: 'pending', type: 'assessor', metrics: [{text:'💤 等待中',cls:'gray'}] },
            { id: '06', name: '证据复核', role: 'Evidence Reviewer', status: 'pending', type: 'reviewer', metrics: [{text:'💤 等待中',cls:'gray'}] },
            { id: '07', name: '岗位匹配官', role: 'Role Mapping', status: 'pending', type: 'matcher', metrics: [{text:'💤 等待中',cls:'gray'}] },
        ];

        const connections = [
            { from: '01', to: '02', status: 'pending' },
            { from: '01', to: '03', status: 'pending' },
            { from: '02', to: '04', status: 'pending' },
            { from: '03', to: '04', status: 'pending' },
            { from: '04', to: '05', status: 'pending' },
            { from: '04', to: '06', status: 'pending' },
            { from: '05', to: '07', status: 'pending' },
            { from: '06', to: '07', status: 'pending' },
        ];

        // Build agent cards
        const grid = document.getElementById('agentsGrid');
        agents.forEach(a => {
            const card = document.createElement('div');
            card.className = `agent-card ${a.status}${a.isHub ? ' hub' : ''}`;
            card.dataset.nodeId = a.id;
            
            let metricsHTML = a.metrics.map(m => `<span class="metric-tag ${m.cls}">${m.text}</span>`).join('');
            let loadingHTML = a.hasLoading ? '<div class="loading-bar"><div class="loading-bar-fill"></div></div>' : '';
            
            card.innerHTML = `
                <div class="agent-badge">${a.id}</div>
                <div class="status-badge ${a.status}">${a.status === 'completed' ? '已完成' : a.status === 'active' ? '处理中' : '待启动'}</div>
                <div class="agent-3d-container" id="canvas-${a.id}"></div>
                <div class="agent-name">${a.name}</div>
                <div class="agent-role">${a.role}</div>
                ${loadingHTML}
                <div class="agent-metrics">${metricsHTML}</div>
            `;
            grid.appendChild(card);
        });

        // ===== 3D CHARACTER CREATION =====
        function createCharacter(containerEl, type, isHub) {
            const size = isHub ? 140 : 120;
            const container = document.createElement('div');
            container.style.width = size + 'px';
            container.style.height = size + 'px';
            containerEl.appendChild(container);

            const scene = new THREE.Scene();
            scene.background = null;
            
            const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
            camera.position.set(0, 1.2, 4.5);
            camera.lookAt(0, 0.6, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(size, size);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dl = new THREE.DirectionalLight(0xffffff, 0.8);
            dl.position.set(3, 5, 4);
            scene.add(dl);
            const rl = new THREE.DirectionalLight(0xa78bfa, 0.25);
            rl.position.set(-3, 2, -2);
            scene.add(rl);
            const fl = new THREE.DirectionalLight(0xfbbf24, 0.15);
            fl.position.set(0, -2, 3);
            scene.add(fl);

            const group = new THREE.Group();
            scene.add(group);

            // === MATERIALS ===
            const skinColors = {
                profile: 0xfde68a, analyst: 0xfde68a, evidence: 0xfde68a,
                advisor: 0xfde68a, assessor: 0xfde68a, reviewer: 0xfde68a, matcher: 0xe2e8f0
            };
            const skinColor = skinColors[type];
            const skinMat = new THREE.MeshLambertMaterial({ color: skinColor });
            
            function mat(color) { return new THREE.MeshLambertMaterial({ color }); }
            function mesh(geo, material, pos, rot, scale) {
                const m = new THREE.Mesh(geo, material);
                if (pos) m.position.set(pos[0], pos[1], pos[2]);
                if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
                if (scale) m.scale.set(scale[0], scale[1], scale[2]);
                group.add(m);
                return m;
            }

            // ========== PROFILE INTAKE (画像输入) - Scanner with clipboard ==========
            if (type === 'profile') {
                // Body - slightly taller, thin
                mesh(new THREE.CylinderGeometry(0.4, 0.5, 1.0, 12), mat(0x3b82f6), [0, -0.2, 0]);
                
                // Head - round
                mesh(new THREE.SphereGeometry(0.45, 20, 20), skinMat, [0, 0.75, 0]);
                
                // Eyes
                mesh(new THREE.SphereGeometry(0.07, 10, 10), mat(0x1e293b), [-0.15, 0.8, 0.38]);
                mesh(new THREE.SphereGeometry(0.07, 10, 10), mat(0x1e293b), [0.15, 0.8, 0.38]);
                mesh(new THREE.SphereGeometry(0.025, 6, 6), mat(0xffffff), [-0.13, 0.82, 0.42]);
                mesh(new THREE.SphereGeometry(0.025, 6, 6), mat(0xffffff), [0.17, 0.82, 0.42]);
                
                // Smile
                const smileCurve = new THREE.EllipseCurve(0, 0, 0.1, 0.06, 0, Math.PI, false);
                const smilePts = smileCurve.getPoints(15);
                const smileGeo = new THREE.BufferGeometry().setFromPoints(smilePts.map(p => new THREE.Vector3(p.x, p.y + 0.68, 0.42)));
                mesh(smileGeo, new THREE.LineBasicMaterial({ color: 0x1e293b }));
                
                // Cheeks
                mesh(new THREE.SphereGeometry(0.08, 8, 8), mat(0xfda4af), [-0.28, 0.72, 0.32], null, [1, 0.6, 0.5]);
                mesh(new THREE.SphereGeometry(0.08, 8, 8), mat(0xfda4af), [0.28, 0.72, 0.32], null, [1, 0.6, 0.5]);
                
                // Hair - short spiky
                for (let i = 0; i < 5; i++) {
                    const spikeGeo = new THREE.ConeGeometry(0.08, 0.2, 6);
                    const spike = new THREE.Mesh(spikeGeo, mat(0x3b82f6));
                    spike.position.set(-0.15 + i * 0.08, 1.15, -0.05 + (i - 2) * 0.02);
                    spike.rotation.z = (i - 2) * 0.15;
                    group.add(spike);
                }
                
                // Left arm holding scanner
                mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8), skinMat, [-0.55, 0.1, 0.15], [0, 0, 0.5]);
                
                // Scanner device
                mesh(new THREE.BoxGeometry(0.3, 0.2, 0.15), mat(0x06b6d4), [-0.75, 0.3, 0.2]);
                mesh(new THREE.BoxGeometry(0.25, 0.12, 0.03), mat(0x22d3ee), [-0.75, 0.3, 0.28]);
                // Scanner beam
                mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 6), mat(0x22d3ee), [-0.75, 0.1, 0.3], [0.5, 0, 0]);
                
                // Right arm holding clipboard
                mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.6, 8), skinMat, [0.5, 0.0, 0.2], [0, 0, -0.4]);
                
                // Clipboard
                mesh(new THREE.BoxGeometry(0.25, 0.35, 0.03), mat(0xf59e0b), [0.65, 0.0, 0.25]);
                mesh(new THREE.BoxGeometry(0.22, 0.05, 0.02), mat(0xd97706), [0.65, 0.15, 0.27]);
                // Paper on clipboard
                mesh(new THREE.BoxGeometry(0.2, 0.25, 0.01), mat(0xffffff), [0.65, -0.02, 0.28]);
                
                // Feet
                mesh(new THREE.SphereGeometry(0.15, 8, 8), mat(0x1e40af), [-0.2, -0.75, 0.1]);
                mesh(new THREE.SphereGeometry(0.15, 8, 8), mat(0x1e40af), [0.2, -0.75, 0.1]);
            }

            // ========== INDUSTRY ANALYST (行业分析师) - Glasses + charts + big brain ==========
            if (type === 'analyst') {
                // Body - boxy, professional
                mesh(new THREE.BoxGeometry(0.9, 1.0, 0.5), mat(0x4f46e5), [0, -0.2, 0]);
                
                // Head - larger (big brain)
                mesh(new THREE.SphereGeometry(0.5, 20, 20), skinMat, [0, 0.85, 0]);
                
                // BIG glasses
                const glassFrame = mat(0x1e40af);
                mesh(new THREE.TorusGeometry(0.15, 0.03, 8, 16), glassFrame, [-0.18, 0.9, 0.42], [0, 0, 0]);
                mesh(new THREE.TorusGeometry(0.15, 0.03, 8, 16), glassFrame, [0.18, 0.9, 0.42], [0, 0, 0]);
                // Lens
                mesh(new THREE.CircleGeometry(0.14, 16), mat(0x93c5fd), [-0.18, 0.9, 0.42]);
                mesh(new THREE.CircleGeometry(0.14, 16), mat(0x93c5fd), [0.18, 0.9, 0.42]);
                // Bridge
                mesh(new THREE.BoxGeometry(0.1, 0.03, 0.02), glassFrame, [0, 0.9, 0.43]);
                // Arms
                mesh(new THREE.BoxGeometry(0.02, 0.02, 0.3), glassFrame, [-0.33, 0.9, 0.3]);
                mesh(new THREE.BoxGeometry(0.02, 0.02, 0.3), glassFrame, [0.33, 0.9, 0.3]);

        setTimeout(() => {
            agents.forEach(a => {
                const containerEl = document.getElementById(`canvas-${a.id}`);
                if (containerEl) {
                    createCharacter(containerEl, a.type, a.isHub);
                }
            });
        }, 300);

        // ===== CONNECTION LINES =====
        const connCanvas = document.getElementById('connectionsCanvas');
        const connCtx = connCanvas.getContext('2d');
        let flowParticles = [];

        function resizeConnCanvas() {
            const canvas = document.getElementById('workflowCanvas');
            connCanvas.width = canvas.offsetWidth * window.devicePixelRatio;
            connCanvas.height = canvas.offsetHeight * window.devicePixelRatio;
            connCanvas.style.width = canvas.offsetWidth + 'px';
            connCanvas.style.height = canvas.offsetHeight + 'px';
            connCtx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        }

        function getAgentCenter(nodeId) {
            const card = document.querySelector(`[data-node-id="${nodeId}"]`);
            if (!card) return null;
            const canvasRect = document.getElementById('workflowCanvas').getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();
            return {
                x: cardRect.left + cardRect.width / 2 - canvasRect.left,
                y: cardRect.top + cardRect.height / 2 - canvasRect.top
            };
        }

        function initFlowParticles() {
            flowParticles = [];
            connections.forEach((conn, idx) => {
                if (conn.status === 'completed' || conn.status === 'active') {
                    flowParticles.push({
                        conn,
                        progress: Math.random(),
                        speed: conn.status === 'active' ? 0.008 : 0.003 + idx * 0.0003,
                        size: conn.status === 'active' ? 7 : 4,
                    });
                }
            });
        }

        let connAnimFrame;
        function drawConnections() {
            const w = connCanvas.width / window.devicePixelRatio;
            const h = connCanvas.height / window.devicePixelRatio;
            connCtx.clearRect(0, 0, w, h);

            connections.forEach((conn, idx) => {
                const from = getAgentCenter(conn.from);
                const to = getAgentCenter(conn.to);
                if (!from || !to) return;

                const dx = to.x - from.x;
                const dy = to.y - from.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const curvature = Math.min(50, dist * 0.1);
                const nx = -dy / dist * curvature;
                const ny = dx / dist * curvature;
                const mx = (from.x + to.x) / 2 + nx;
                const my = (from.y + to.y) / 2 + ny;

                connCtx.beginPath();
                connCtx.moveTo(from.x, from.y);
                connCtx.quadraticCurveTo(mx, my, to.x, to.y);

                if (conn.status === 'completed') {
                    const grad = connCtx.createLinearGradient(from.x, from.y, to.x, to.y);
                    grad.addColorStop(0, 'rgba(52, 211, 153, 0.7)');
                    grad.addColorStop(1, 'rgba(110, 231, 183, 0.2)');
                    connCtx.strokeStyle = grad;
                    connCtx.lineWidth = 3;
                    connCtx.stroke();

                    connCtx.beginPath();
                    connCtx.moveTo(from.x, from.y);
                    connCtx.quadraticCurveTo(mx, my, to.x, to.y);
                    connCtx.strokeStyle = 'rgba(52, 211, 153, 0.1)';
                    connCtx.lineWidth = 10;
                    connCtx.stroke();
                } else if (conn.status === 'active') {
                    connCtx.setLineDash([8, 6]);
                    connCtx.lineDashOffset = -Date.now() / 30;
                    const grad = connCtx.createLinearGradient(from.x, from.y, to.x, to.y);
                    grad.addColorStop(0, 'rgba(251, 191, 36, 0.8)');
                    grad.addColorStop(1, 'rgba(245, 158, 11, 0.2)');
                    connCtx.strokeStyle = grad;
                    connCtx.lineWidth = 3.5;
                    connCtx.stroke();
                    connCtx.setLineDash([]);

                    connCtx.beginPath();
                    connCtx.moveTo(from.x, from.y);
                    connCtx.quadraticCurveTo(mx, my, to.x, to.y);
                    connCtx.strokeStyle = 'rgba(251, 191, 36, 0.1)';
                    connCtx.lineWidth = 12;
                    connCtx.stroke();
                } else {
                    connCtx.setLineDash([4, 8]);
                    connCtx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
                    connCtx.lineWidth = 2;
                    connCtx.stroke();
                    connCtx.setLineDash([]);
                }
            });

            // Flow particles
            flowParticles.forEach(fp => {
                const conn = fp.conn;
                const from = getAgentCenter(conn.from);
                const to = getAgentCenter(conn.to);
                if (!from || !to) return;

                const dx = to.x - from.x;
                const dy = to.y - from.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const curvature = Math.min(50, dist * 0.1);
                const nx = -dy / dist * curvature;
                const ny = dx / dist * curvature;
                const mx = (from.x + to.x) / 2 + nx;
                const my = (from.y + to.y) / 2 + ny;

                const t = fp.progress;
                const px = (1 - t) * (1 - t) * from.x + 2 * (1 - t) * t * mx + t * t * to.x;
                const py = (1 - t) * (1 - t) * from.y + 2 * (1 - t) * t * my + t * t * to.y;

                // Glow
                connCtx.beginPath();
                connCtx.arc(px, py, fp.size + 8, 0, Math.PI * 2);
                connCtx.fillStyle = conn.status === 'active' ? 'rgba(251, 191, 36, 0.12)' : 'rgba(52, 211, 153, 0.12)';
                connCtx.fill();

                // Core
                connCtx.beginPath();
                connCtx.arc(px, py, fp.size, 0, Math.PI * 2);
                connCtx.fillStyle = conn.status === 'active' ? '#fbbf24' : '#34d399';
                connCtx.fill();

                // Inner bright
                connCtx.beginPath();
                connCtx.arc(px, py, fp.size * 0.4, 0, Math.PI * 2);
                connCtx.fillStyle = 'rgba(255,255,255,0.8)';
                connCtx.fill();

                fp.progress += fp.speed;
                if (fp.progress > 1) fp.progress = 0;
            });

            connAnimFrame = requestAnimationFrame(drawConnections);
        }

        function initConnections() {
            resizeConnCanvas();
            initFlowParticles();
            drawConnections();
        }

        window.addEventListener('resize', () => {
            if (connAnimFrame) cancelAnimationFrame(connAnimFrame);
            resizeConnCanvas();
            drawConnections();
        });

        // ===== 流程动画控制 =====
        let workflowActive = false;
        let currentAgentIndex = 0;
        let workflowTimer = null;

        const statusBarIcon = document.querySelector('.status-icon');
        const statusBarTitle = document.querySelector('.status-text h3');
        const statusBarDesc = document.querySelector('.status-text p');
        const statusBarTime = document.querySelector('.status-time .time');
        const statusBarTimeLabel = document.querySelector('.status-time .label');

        function updateStatusBar(icon, title, desc) {
            statusBarIcon.textContent = icon;
            statusBarTitle.textContent = title;
            statusBarDesc.textContent = desc;
            statusBarTime.textContent = new Date().toLocaleString('zh-CN');
        }

        function updateAgentStatus(index, status) {
            const agent = agents[index];
            agent.status = status;
            
            const card = document.querySelector(`[data-node-id="${agent.id}"]`);
            if (card) {
                card.className = `agent-card ${status}${agent.isHub ? ' hub' : ''}`;
                
                const statusBadge = card.querySelector('.status-badge');
                if (statusBadge) {
                    statusBadge.className = `status-badge ${status}`;
                    statusBadge.textContent = status === 'completed' ? '已完成' : status === 'active' ? '处理中' : '待启动';
                }
                
                const loadingBar = card.querySelector('.loading-bar');
                if (status === 'active' && !loadingBar) {
                    const metricsDiv = card.querySelector('.agent-metrics');
                    if (metricsDiv) {
                        const loadingHTML = '<div class="loading-bar"><div class="loading-bar-fill"></div></div>';
                        metricsDiv.insertAdjacentHTML('beforebegin', loadingHTML);
                    }
                } else if (status === 'completed' && loadingBar) {
                    loadingBar.remove();
                    // 更新指标显示
                    const metricsDiv = card.querySelector('.agent-metrics');
                    if (metricsDiv) {
                        metricsDiv.innerHTML = agent.metrics.map(m => `<span class="metric-tag ${m.cls}">${m.text}</span>`).join('');
                    }
                }
                
                // 更新连接线状态
                updateConnectionStatus(agent.id, status);
            }
        }

        function updateConnectionStatus(fromId, status) {
            const fromAgent = agents.find(a => a.id === fromId);
            if (!fromAgent) return;
            
            connections.forEach(conn => {
                if (conn.from === fromId) {
                    conn.status = status === 'completed' ? 'completed' : status === 'active' ? 'active' : 'pending';
                }
            });
            
            // 重新初始化流动粒子
            initFlowParticles();
        }

        function resetWorkflow() {
            workflowActive = false;
            currentAgentIndex = 0;
            if (workflowTimer) {
                clearInterval(workflowTimer);
                workflowTimer = null;
            }
            
            // 重置所有agent状态（除了第一个）
            for (let i = 1; i < agents.length; i++) {
                agents[i].status = 'pending';
                agents[i].metrics = [{text:'💤 等待中',cls:'gray'}];
            }
            
            // 重置连接线
            connections.forEach((conn, idx) => {
                if (idx < 5) {
                    conn.status = 'completed';
                } else {
                    conn.status = 'pending';
                }
            });
            
            // 更新UI
            document.querySelectorAll('.agent-card').forEach((card, idx) => {
                const status = idx === 0 ? 'completed' : 'pending';
                const agent = agents[idx];
                card.className = `agent-card ${status}${agent.isHub ? ' hub' : ''}`;
                
                const statusBadge = card.querySelector('.status-badge');
                if (statusBadge) {
                    statusBadge.className = `status-badge ${status}`;
                    statusBadge.textContent = status === 'completed' ? '已完成' : status === 'active' ? '处理中' : '待启动';
                }
                
                // 移除加载条
                const loadingBar = card.querySelector('.loading-bar');
                if (loadingBar) loadingBar.remove();
                
                // 重置指标
                const metricsDiv = card.querySelector('.agent-metrics');
                if (metricsDiv && idx > 0) {
                    metricsDiv.innerHTML = '<span class="metric-tag gray">💤 等待中</span>';
                }
            });
            
            // 重置按钮
            const btn = document.querySelector('.btn-primary');
            btn.textContent = '🚀 启动生成';
            btn.onclick = startWorkflow;
            
            updateStatusBar('⏸️', '本次生成已停止', '旧任务已停止，不会写入报告；可以重新启动一次新的多智能体生成。');
            statusBarTimeLabel.textContent = '更新时间';
            
            // 重置连接线
            initFlowParticles();
        }

        function startWorkflow() {
            if (workflowActive) return;
            
            workflowActive = true;
            currentAgentIndex = 1; // 从第二个agent开始（第一个已完成）
            
            const btn = document.querySelector('.btn-primary');
            btn.textContent = '⏳ 生成中...';
            btn.onclick = () => {};
            
            updateStatusBar('⚡', '正在生成中...', '多智能体协作流运行中，请稍候...');
            
            // 每40秒处理一个agent
            workflowTimer = setInterval(() => {
                if (currentAgentIndex < agents.length) {
                    const agent = agents[currentAgentIndex];
                    
                    // 当前agent变为处理中
                    if (agent.status !== 'active') {
                        updateAgentStatus(currentAgentIndex, 'active');
                    }
                    
                    // 上一个agent完成
                    if (currentAgentIndex > 1) {
                        updateAgentStatus(currentAgentIndex - 1, 'completed');
                    }
                    
                    currentAgentIndex++;
                    updateStatusBar('⚡', `正在处理: ${agent.name}`, `已完成 ${currentAgentIndex - 2}/${agents.length - 1} 个智能体...`);
                    
                } else {
                    // 所有agent完成
                    clearInterval(workflowTimer);
                    workflowTimer = null;
                    workflowActive = false;
                    
                    // 最后一个agent也标记为完成
                    updateAgentStatus(agents.length - 1, 'completed');
                    
                    // 改变按钮为重新生成
                    const btn = document.querySelector('.btn-primary');
                    btn.textContent = '🔄 重新生成';
                    btn.onclick = resetWorkflow;
                    
                    updateStatusBar('✅', '生成已完成', '所有智能体处理完毕，报告已生成！');
                }
            }, 40000); // 40秒间隔
        }

        // 重写 restartGen 函数
        function restartGen() {
            resetWorkflow();
            startWorkflow();
        }

        // 初始化：设置第一个按钮为启动生成
        window.addEventListener('load', () => {
            const btn = document.querySelector('.btn-primary');
            if (btn) {
                btn.textContent = '🚀 启动生成';
                btn.onclick = startWorkflow;
            }
            
            setTimeout(initConnections, 600);
        });
    </script>
</body>
</html>

{# 全局页面加载动画 — 极简、零依赖、首屏即可见。
   放在 <body> 最顶端即可。所有样式内联，避免外部 CSS 未到达时白屏。
#}
<style>
  html.app-loading body { overflow: hidden; }
  #appPageLoader {
    position: fixed;
    inset: 0;
    z-index: 2147483600;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(900px 540px at 12% -10%, rgba(186, 230, 253, 0.55), transparent 62%),
      radial-gradient(820px 520px at 100% 0%, rgba(165, 180, 252, 0.42), transparent 60%),
      radial-gradient(720px 460px at 50% 110%, rgba(196, 181, 253, 0.35), transparent 64%),
      linear-gradient(160deg, #f8fbff 0%, #eef2ff 50%, #ede9fe 100%);
    color: #1f2c3a;
    font-family: "Plus Jakarta Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    transition: opacity 0.45s ease, visibility 0.45s ease;
    will-change: opacity;
  }
  #appPageLoader[data-state="hidden"] {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #appPageLoader .apl-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    text-align: center;
    transform: translateY(-2vh);
  }
  #appPageLoader .apl-orb {
    position: relative;
    width: 96px;
    height: 96px;
  }
  #appPageLoader .apl-orb::before,
  #appPageLoader .apl-orb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
    animation: aplSpin 1.4s cubic-bezier(0.6, 0.05, 0.4, 0.95) infinite;
  }
  #appPageLoader .apl-orb::before {
    border-top-color: #667eea;
    border-right-color: #764ba2;
  }
  #appPageLoader .apl-orb::after {
    inset: 14px;
    border-top-color: #355b82;
    border-left-color: #4f8edc;
    animation-direction: reverse;
    animation-duration: 1.05s;
  }
  #appPageLoader .apl-orb-core {
    position: absolute;
    inset: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    box-shadow: 0 14px 32px rgba(102, 126, 234, 0.42);
    animation: aplPulse 1.6s ease-in-out infinite;
  }
  #appPageLoader .apl-brand {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.32em;
    background: linear-gradient(135deg, #355b82 0%, #764ba2 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  #appPageLoader .apl-tip {
    font-size: 0.78rem;
    color: #617487;
    letter-spacing: 0.06em;
  }
  #appPageLoader .apl-bar {
    width: 180px;
    height: 3px;
    border-radius: 999px;
    background: rgba(53, 91, 130, 0.12);
    overflow: hidden;
    position: relative;
  }
  #appPageLoader .apl-bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -40%;
    height: 100%;
    width: 40%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, #667eea, #764ba2, transparent);
    animation: aplSlide 1.4s ease-in-out infinite;
  }
  @keyframes aplSpin {
    to { transform: rotate(360deg); }
  }
  @keyframes aplPulse {
    0%, 100% { transform: scale(1); opacity: 0.92; }
    50% { transform: scale(0.86); opacity: 0.7; }
  }
  @keyframes aplSlide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    #appPageLoader .apl-orb::before,
    #appPageLoader .apl-orb::after,
    #appPageLoader .apl-orb-core,
    #appPageLoader .apl-bar::after {
      animation: none;
    }
  }
</style>
<div id="appPageLoader" role="status" aria-live="polite" aria-label="页面加载中">
  <div class="apl-stage">
    <div class="apl-orb">
      <div class="apl-orb-core"></div>
    </div>
    <div class="apl-brand" data-apl-brand>智 航 生 涯</div>
    <div class="apl-bar"></div>
    <div class="apl-tip" data-apl-tip>正在为你准备工作台 · Loading workspace</div>
  </div>
</div>
<script>
  (function () {
    var html = document.documentElement;
    html.classList.add("app-loading");
    var loader = document.getElementById("appPageLoader");
    if (!loader) return;
    var autoHideTimer = null;
    var fallbackTimer = null;
    var defaultBrand = "智 航 生 涯";
    var defaultTip = "正在为你准备工作台 · Loading workspace";
    function setText(opts) {
      opts = opts || {};
      var brandEl = loader.querySelector("[data-apl-brand]");
      var tipEl = loader.querySelector("[data-apl-tip]");
      if (brandEl) brandEl.textContent = opts.brand || defaultBrand;
      if (tipEl) tipEl.textContent = opts.tip || defaultTip;
    }
    function showLoader(opts) {
      opts = opts || {};
      if (autoHideTimer) { clearTimeout(autoHideTimer); autoHideTimer = null; }
      if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
      setText(opts);
      loader.removeAttribute("data-state");
      html.classList.add("app-loading");
      if (typeof opts.timeoutMs === "number" && opts.timeoutMs > 0) {
        fallbackTimer = setTimeout(hideLoader, opts.timeoutMs);
      }
    }
    function hideLoader() {
      if (loader.getAttribute("data-state") === "hidden") return;
      loader.setAttribute("data-state", "hidden");
      html.classList.remove("app-loading");
      if (autoHideTimer) { clearTimeout(autoHideTimer); autoHideTimer = null; }
      if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = null; }
    }
    function authCheckingActive() {
      return !!(document.body && document.body.classList.contains("auth-checking"));
    }
    function attemptAutoHide() {
      if (!authCheckingActive()) {
        hideLoader();
        return;
      }
      var observer = new MutationObserver(function () {
        if (!authCheckingActive()) {
          observer.disconnect();
          hideLoader();
        }
      });
      observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });
    }
    window.__hidePageLoader = hideLoader;
    window.__showPageLoader = showLoader;
    if (document.readyState === "complete") {
      requestAnimationFrame(attemptAutoHide);
    } else {
      window.addEventListener("load", function () {
        requestAnimationFrame(function () {
          autoHideTimer = setTimeout(attemptAutoHide, 120);
        });
      });
    }
    fallbackTimer = setTimeout(hideLoader, 9000);
  })();
</script>

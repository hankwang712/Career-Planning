<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-border: rgba(0, 0, 0, 0.06);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --text-primary: rgba(0, 0, 0, 0.9);
  --text-secondary: rgba(0, 0, 0, 0.6);
  --text-muted: rgba(0, 0, 0, 0.4);
  --accent-cyan: #0ea5e9;
  --accent-purple: #8b5cf6;
  --accent-pink: #ec4899;
  --accent-green: #10b981;
  --accent-orange: #f59e0b;
  --accent-red: #ef4444;
  --bg-primary: #f8fafc;
  --bg-secondary: #f1f5f9;
  --liquid-1: rgba(14, 165, 233, 0.15);
  --liquid-2: rgba(139, 92, 246, 0.15);
  --liquid-3: rgba(236, 72, 153, 0.15);
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.7;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* Background */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.5;
  animation: orbFloat 25s ease-in-out infinite;
}

.bg-orb:nth-child(1) {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, var(--liquid-1), transparent 70%);
  top: -10%;
  left: -5%;
  animation-delay: 0s;
}

.bg-orb:nth-child(2) {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--liquid-2), transparent 70%);
  top: 50%;
  right: -10%;
  animation-delay: -8s;
}

.bg-orb:nth-child(3) {
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--liquid-3), transparent 70%);
  bottom: -20%;
  left: 30%;
  animation-delay: -16s;
}

@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(40px, -30px) scale(1.1); }
  66% { transform: translate(-30px, 40px) scale(0.95); }
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image: 
    linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Layout */
.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* Top Navigation */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 32px;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  z-index: 100;
  flex-shrink: 0;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 0 12px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.9);
  color: var(--text-secondary);
  font-size: 0.8rem;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.3s ease;
}

.nav-back:hover {
  color: var(--text-primary);
  background: #fff;
  transform: translateY(-1px);
}

.nav-logo {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 16px;
  font-weight: 700;
}

.nav-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-secondary);
  padding: 4px;
  border-radius: 14px;
}

.nav-tab {
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s ease;
  border: none;
  background: transparent;
  position: relative;
}

.nav-tab:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.5);
}

.nav-tab.active {
  background: white;
  color: var(--accent-cyan);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.nav-tab .tab-num {
  font-size: 0.7rem;
  margin-right: 6px;
  opacity: 0.6;
}

.nav-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--text-muted);
}

.status-dot {
  width: 8px;
  height: 8px;
  background: var(--accent-green);
  border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* Main Content Area */
.main-content {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
body.resume-deep-audit-standalone .main-content {
  overflow: hidden;
  padding: 16px 24px 28px;
  display: flex;
  flex-direction: column;
}
.resume-deep-audit-root {
  max-width: 1320px;
  margin: 0 auto;
  width: 100%;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.tab-panel {
  position: absolute;
  inset: 0;
  padding: 32px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transform: translateY(20px);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}

.tab-panel.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: all;
}

/* Scrollbar */
.tab-panel::-webkit-scrollbar {
  width: 8px;
}

.tab-panel::-webkit-scrollbar-track {
  background: transparent;
}

.tab-panel::-webkit-scrollbar-thumb {
  background: rgba(0, 0, 0, 0.12);
  border-radius: 4px;
}

.tab-panel::-webkit-scrollbar-thumb:hover {
  background: rgba(0, 0, 0, 0.2);
}

/* Liquid Glass Card */
.liquid-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 24px;
  backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
  transition: all 0.4s ease;
}

.liquid-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), transparent 50%, rgba(255, 255, 255, 0.4));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.liquid-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
  border-color: rgba(14, 165, 233, 0.2);
}

/* Liquid Border Effect */
.liquid-border {
  position: relative;
}

.liquid-border::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 22px;
  background: conic-gradient(from 0deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-green), var(--accent-cyan));
  z-index: -1;
  opacity: 0;
  transition: opacity 0.4s ease;
  animation: liquidSpin 6s linear infinite;
}

.liquid-border:hover::after {
  opacity: 0.5;
}

@keyframes liquidSpin {
  to { transform: rotate(360deg); }
}

/* Dashboard Grid */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 28px;
}

.metric-card {
  background: white;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 24px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
}

.metric-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
}

.metric-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
}

.metric-card:nth-child(1)::before { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); }
.metric-card:nth-child(2)::before { background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan)); }
.metric-card:nth-child(3)::before { background: linear-gradient(90deg, var(--accent-orange), var(--accent-pink)); }
.metric-card:nth-child(4)::before { background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink)); }

.metric-value {
  font-size: 2.5rem;
  font-weight: 800;
  line-height: 1;
  margin-bottom: 6px;
}

.metric-card:nth-child(1) .metric-value { color: var(--accent-cyan); }
.metric-card:nth-child(2) .metric-value { color: var(--accent-green); }
.metric-card:nth-child(3) .metric-value { color: var(--accent-orange); }
.metric-card:nth-child(4) .metric-value { color: var(--accent-purple); }

.metric-label {
  font-size: 0.85rem;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 12px;
}

.metric-bar {
  height: 6px;
  background: var(--bg-secondary);
  border-radius: 3px;
  overflow: hidden;
}

.metric-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.metric-card:nth-child(1) .metric-bar-fill { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)); width: 95%; }
.metric-card:nth-child(2) .metric-bar-fill { background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan)); width: 88%; }
.metric-card:nth-child(3) .metric-bar-fill { background: linear-gradient(90deg, var(--accent-orange), var(--accent-pink)); width: 62%; }
.metric-card:nth-child(4) .metric-bar-fill { background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink)); width: 45%; }

/* Two Column Layout */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

/* Audit Item */
.audit-item {
  margin-bottom: 24px;
  padding-left: 20px;
  border-left: 3px solid var(--bg-secondary);
  transition: border-color 0.3s ease;
}

.audit-item:hover {
  border-left-color: var(--accent-cyan);
}

.audit-question {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
  font-weight: 700;
  font-size: 1rem;
  color: var(--text-primary);
}

.audit-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
  margin-top: 2px;
}

.audit-impact {
  margin-bottom: 12px;
  padding: 14px;
  background: rgba(236, 72, 153, 0.06);
  border: 1px solid rgba(236, 72, 153, 0.15);
  border-radius: 10px;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.audit-impact-label {
  color: var(--accent-pink);
  font-weight: 700;
  margin-bottom: 4px;
  display: block;
  font-size: 0.8rem;
}

.audit-suggestion {
  padding: 14px;
  background: rgba(16, 185, 129, 0.06);
  border: 1px solid rgba(16, 185, 129, 0.15);
  border-radius: 10px;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.audit-suggestion-label {
  color: var(--accent-green);
  font-weight: 700;
  margin-bottom: 4px;
  display: block;
  font-size: 0.8rem;
}

/* Comparison Grid */
.comparison-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 12px 0;
}

.comparison-item {
  padding: 14px;
  border-radius: 10px;
  font-size: 0.85rem;
  line-height: 1.6;
}

.comparison-item.before {
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.2);
}

.comparison-item.after {
  background: rgba(16, 185, 129, 0.08);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

.comparison-label {
  font-weight: 700;
  margin-bottom: 6px;
  display: block;
  font-size: 0.8rem;
}

.comparison-item.before .comparison-label { color: var(--accent-orange); }
.comparison-item.after .comparison-label { color: var(--accent-green); }

/* Formula Box */
.formula-box {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.08), rgba(139, 92, 246, 0.08));
  border: 1px solid rgba(14, 165, 233, 0.2);
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.formula-box strong {
  color: var(--accent-cyan);
}

/* Timeline */
.timeline {
  position: relative;
  padding-left: 32px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink), var(--accent-green));
  border-radius: 2px;
}

.timeline-item {
  position: relative;
  margin-bottom: 24px;
  padding: 20px;
  background: white;
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  transition: all 0.3s ease;
}

.timeline-item:hover {
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -38px;
  top: 24px;
  width: 14px;
  height: 14px;
  background: white;
  border: 3px solid var(--accent-cyan);
  border-radius: 50%;
}

.timeline-item:nth-child(2)::before { border-color: var(--accent-purple); }
.timeline-item:nth-child(3)::before { border-color: var(--accent-pink); }
.timeline-item:nth-child(4)::before { border-color: var(--accent-green); }

/* Checklist */
.checklist {
  list-style: none;
  margin-top: 16px;
}

.checklist-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px;
  background: white;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  margin-bottom: 12px;
  transition: all 0.3s ease;
}

.checklist-item:hover {
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
  transform: translateX(4px);
}

.check-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.85rem;
  font-weight: 700;
  color: white;
}

.check-icon.primary {
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
}

.check-text {
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.check-label {
  font-weight: 700;
  color: var(--text-primary);
  display: block;
  margin-bottom: 4px;
}

/* Resume Template */
.resume-template {
  background: white;
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 40px;
  position: relative;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
}

.resume-template::before {
  content: '修改后简历范本';
  position: absolute;
  top: -12px;
  left: 28px;
  padding: 6px 18px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: 100px;
  letter-spacing: 1px;
}

.resume-header {
  text-align: center;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--bg-secondary);
  margin-bottom: 24px;
}

.resume-name {
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 6px;
}

.resume-contact {
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.resume-section {
  margin-bottom: 24px;
}

.resume-section-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--accent-cyan);
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--glass-border);
}

.resume-item {
  margin-bottom: 14px;
}

.resume-item-title {
  font-weight: 700;
  margin-bottom: 4px;
  font-size: 0.95rem;
}

.resume-item-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.resume-item-content {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.8;
}

/* Highlight Text */
.highlight { color: var(--accent-cyan); font-weight: 700; }
.highlight-pink { color: var(--accent-pink); font-weight: 700; }
.highlight-green { color: var(--accent-green); font-weight: 700; }

/* SVG Decorations */
.deco-svg {
  position: absolute;
  opacity: 0.1;
  pointer-events: none;
}

/* Section Header */
.section-header {
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--bg-secondary);
}

.section-step {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--accent-cyan);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.section-title {
  font-size: 1.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #000, rgba(0, 0, 0, 0.8));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Subsection */
.subsection {
  margin: 24px 0;
}

.subsection-title {
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.subsection-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
  border-radius: 2px;
}

/* Radar Chart Container */
.radar-container {
  width: 280px;
  height: 280px;
  margin: 0 auto;
  position: relative;
}

/* Progress Ring */
.progress-ring {
  width: 120px;
  height: 120px;
  margin: 0 auto 16px;
}

/* Responsive */
@media (max-width: 1024px) {
  .dashboard-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .two-col {
    grid-template-columns: 1fr;
  }
  .tab-panel {
    padding: 24px;
  }
}

@media (max-width: 768px) {
  .top-nav {
    padding: 12px 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .nav-left {
    width: 100%;
    justify-content: flex-start;
  }
  .nav-tabs {
    order: 3;
    width: 100%;
    overflow-x: auto;
    justify-content: flex-start;
  }
  .nav-tab {
    padding: 8px 14px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  .comparison-grid {
    grid-template-columns: 1fr;
  }
  .tab-panel {
    padding: 16px;
  }
}

/* Animation Classes */
.fade-in {
  opacity: 0;
  transform: translateY(15px);
  animation: fadeIn 0.6s ease forwards;
}

.fade-in-delay-1 { animation-delay: 0.1s; }
.fade-in-delay-2 { animation-delay: 0.2s; }
.fade-in-delay-3 { animation-delay: 0.3s; }
.fade-in-delay-4 { animation-delay: 0.4s; }

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Liquid Shimmer Effect */
.liquid-shimmer {
  position: relative;
  overflow: hidden;
}

.liquid-shimmer::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    to bottom right,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, 0.1) 50%,
    rgba(255, 255, 255, 0) 100%
  );

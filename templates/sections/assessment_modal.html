<div id="assessmentModal" class="assessment-modal-overlay hidden" onclick="handleAssessmentOverlayClick(event)">
    <div class="assessment-modal-shell">
        <div class="assessment-modal-header">
            <div>
                <p id="assessmentModalEyebrow" class="assessment-modal-eyebrow">Assessment Center</p>
                <h3 id="assessmentModalTitle" class="assessment-modal-title">用户画像测评中心</h3>
                <p id="assessmentModalSubtitle" class="assessment-modal-subtitle">任选一个测评开始，系统会自动记录进度并同步结果卡片。</p>
            </div>
            <div class="assessment-modal-toolbar">
                <button type="button" class="assessment-toolbar-btn" onclick="toggleAssessmentConfigPanel()">系统 AI 配置</button>
                <button type="button" class="assessment-toolbar-btn" onclick="restartAssessmentFlow()">重新开始</button>
                <button type="button" class="assessment-toolbar-btn danger" onclick="closeAssessmentModal()">关闭</button>
            </div>
        </div>

        <div class="assessment-modal-body">
            <aside class="assessment-modal-side">
                <div class="assessment-side-card">
                    <p class="assessment-mini-label">当前状态</p>
                    <div id="assessmentModalStateText" class="assessment-side-state">等待选择测评</div>
                    <div id="assessmentModalProgressText" class="assessment-side-progress">0 / 0</div>
                </div>

                <div class="assessment-side-card">
                    <p class="assessment-mini-label">进度轨迹</p>
                    <div id="assessmentModalProgressRail" class="assessment-progress-rail"></div>
                </div>

                <div id="assessmentConfigPanel" class="assessment-config-panel hidden">
                    <div class="assessment-side-card">
                        <p class="assessment-mini-label">AI 澄清配置</p>
                        <p class="assessment-config-copy">仅用于 MBTI 临界维度追加题。普通用户只读，系统管理员可统一维护。</p>
                        <label class="assessment-config-label" for="assessmentApiBaseUrl">Base URL</label>
                        <input id="assessmentApiBaseUrl" class="assessment-config-input" type="text" placeholder="https://api.openai.com/v1">
                        <label class="assessment-config-label" for="assessmentApiKey">API Key</label>
                        <input id="assessmentApiKey" class="assessment-config-input" type="password" placeholder="sk-...">
                        <label class="assessment-config-label" for="assessmentModelName">Model</label>
                        <input id="assessmentModelName" class="assessment-config-input" type="text" placeholder="gpt-4o-mini">
                        <button type="button" class="assessment-save-btn" onclick="saveAssessmentConfig()">保存配置</button>
                        <p id="assessmentConfigPanelStatus" class="assessment-config-status">未配置</p>
                    </div>
                </div>
            </aside>

            <section class="assessment-modal-main">
                <div id="assessmentModalContent"></div>
            </section>
        </div>
    </div>
</div>

<section id="matching" class="hidden fade-in">
    <div class="kb-shell">
        <header class="kb-header">
            <div class="kb-header-spacer" aria-hidden="true"></div>

            <div class="kb-header-tabs">
                <button type="button" class="kb-header-tab is-active">岗位知识库</button>
            </div>

            <div class="kb-header-right">
                <span id="knowledgeBaseStatus" class="kb-status-pill">图谱准备中</span>
                <button id="knowledgeBaseMatchButton" type="button" class="kb-match-btn" onclick="startCareerGraphMatching()">
                    开始匹配
                </button>
            </div>
        </header>

        <section class="kb-match-preflight" aria-label="人岗匹配前配置">
            <div class="kb-preflight-main">
                <span class="kb-preflight-kicker">MATCH SETUP</span>
                <h3>先确定城市，再让 AI 做岗位匹配</h3>
                <p>系统会结合测评、简历、访谈、目标方向与城市偏好，从岗位图谱中筛选相关职业，并输出匹配理由、画像差距和可走路径。</p>
            </div>
            <div class="kb-city-planner">
                <div class="kb-city-planner-head">
                    <div>
                        <span>城市偏好</span>
                        <small id="knowledgeBaseCitySummary">未选择时默认读取画像中的目标城市</small>
                    </div>
                    <button id="knowledgeBaseCityClear" type="button" class="kb-city-clear">清空</button>
                </div>
                <div id="knowledgeBaseCityChips" class="kb-city-chips"></div>
                <div class="kb-city-input-row">
                    <input id="knowledgeBaseCityInput" class="kb-city-input" type="text" placeholder="手动输入城市，如 深圳、杭州" autocomplete="off">
                    <button id="knowledgeBaseCityAdd" type="button" class="kb-city-add">加入城市</button>
                </div>
            </div>
        </section>

        <div class="kb-main">
            <div class="kb-graph-area" id="knowledgeBaseArea">
                <div class="kb-toolbar">
                    <button id="knowledgeBaseRefreshBtn" type="button" class="kb-toolbar-btn" title="刷新图谱">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path>
                        </svg>
                    </button>

                    <select id="knowledgeBaseRelationFilter" class="kb-domain-select" title="关系视图">
                        <option value="all">全部关系</option>
                        <option value="promotion">只看晋升</option>
                        <option value="substitution">只看换岗</option>
                    </select>

                    <div class="kb-search-wrap">
                        <svg class="kb-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input id="knowledgeBaseSearchInput" type="text" class="kb-search-input" placeholder="搜索岗位、技能、方向">
                        <div id="knowledgeBaseSearchResults" class="kb-search-results"></div>
                    </div>
                </div>

                <div class="kb-left-panel">
                    <button id="knowledgeBaseLayoutBtn" type="button" class="kb-left-btn" title="布局">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <circle cx="5" cy="5" r="2"></circle>
                            <circle cx="19" cy="5" r="2"></circle>
                            <circle cx="5" cy="19" r="2"></circle>
                            <circle cx="19" cy="19" r="2"></circle>
                        </svg>
                    </button>
                    <div id="knowledgeBaseLayoutMenu" class="kb-layout-menu">
                        <button type="button" class="kb-layout-item is-active" data-layout="force">Force Directed</button>
                        <button type="button" class="kb-layout-item" data-layout="radial">Radial</button>
                        <button type="button" class="kb-layout-item" data-layout="circle">Circular</button>
                    </div>

                    <button id="knowledgeBasePathBtn" type="button" class="kb-left-btn" title="只看路径">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19l5-5 4 4 7-10"></path>
                            <path d="M15 8h5v5"></path>
                        </svg>
                    </button>

                    <button id="knowledgeBaseResetBtn" type="button" class="kb-left-btn" title="重置">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                </div>

                <div id="knowledgeBaseBottomInfo" class="kb-bottom-info">Nodes 0 / 0 · Edges 0</div>

                <div class="kb-zoom-controls">
                    <button id="knowledgeBaseZoomIn" type="button" class="kb-zoom-btn">+</button>
                    <button id="knowledgeBaseZoomOut" type="button" class="kb-zoom-btn">−</button>
                </div>

                <aside id="knowledgeBasePanel" class="kb-right-panel">
                    <div class="kb-right-panel-header">
                        <div>
                            <span id="knowledgeBasePanelTitle" class="kb-right-panel-title">岗位知识库</span>
                            <p id="knowledgeBasePanelSub" class="kb-right-panel-sub">选择一个岗位节点查看详情</p>
                        </div>
                        <div class="kb-right-panel-actions">
                            <button id="knowledgeBasePanelClose" type="button" class="kb-right-panel-btn">×</button>
                        </div>
                    </div>
                    <div id="knowledgeBasePanelBody" class="kb-right-panel-body"></div>
                </aside>

                <div id="knowledgeBaseConnected" class="kb-connected-indicator">
                    <span class="kb-connected-dot"></span>
                    <span>职业图谱在线</span>
                </div>

                <div id="knowledgeBaseCanvas" class="kb-graph-canvas"></div>
                <div id="knowledgeBasePathDeck" class="kb-path-deck is-hidden" aria-live="polite"></div>

                <div id="knowledgeBaseTooltip" class="kb-tooltip">
                    <div id="knowledgeBaseTooltipTitle" class="kb-tooltip-title"></div>
                    <div id="knowledgeBaseTooltipSub" class="kb-tooltip-sub"></div>
                </div>
            </div>
        </div>
    </div>
</section>

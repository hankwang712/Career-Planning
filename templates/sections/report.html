<section id="report" class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-6 hidden fade-in">
    <div class="report-launch-page">
        <div class="report-launch-hero">
            <div>
                <p class="report-launch-kicker">Career Report Pipeline</p>
                <h2 class="report-launch-title">职业生涯发展报告生成台</h2>
                <p class="report-launch-copy">
                    这里仅用于启动与观察多智能体协作状态，不展开任何报告正文。完整报告生成后会同步到个人中心的报告查看器。
                </p>
            </div>
            <div class="report-launch-actions">
                <button id="reportLaunchBtn" type="button" class="report-launch-primary" onclick="startCareerReportGeneration()">启动生成</button>
                <button id="reportCancelBtn" type="button" class="report-launch-danger hidden" onclick="cancelCareerReportGeneration()">停止生成</button>
                <button type="button" class="report-launch-secondary" onclick="window.openUserCenterPage ? openUserCenterPage('report-workspace') : (window.location.href='/user-center#report-workspace')">查看报告中心</button>
            </div>
        </div>

        <div id="reportStatus" class="report-launch-status">
            <div>
                <p id="reportStatusTitle" class="report-launch-status-title">等待启动多智能体流程</p>
                <p id="reportStatusHint" class="report-launch-status-copy">报告正文不会在本页展示；这里只显示阶段、传递方向与完成状态。</p>
            </div>
            <div class="report-launch-status-meta">
                <span>更新时间</span>
                <strong id="reportGeneratedTime">--</strong>
            </div>
        </div>

        <div id="reportAgentPreview" class="report-agent-preview" aria-label="多智能体工作状态预览">
            <div class="report-agent-preview-head">
                <div>
                    <p class="report-launch-kicker">Agent Workflow</p>
                    <h3>多智能体协作流</h3>
                </div>
                <div class="report-agent-legend">
                    <span><i class="solid"></i> 已传递</span>
                    <span><i class="dashed"></i> 当前传递</span>
                </div>
            </div>
            <div id="reportAgentMap" class="report-agent-map"></div>
        </div>
    </div>
</section>

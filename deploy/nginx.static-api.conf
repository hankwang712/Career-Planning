server {
    listen 80;
    server_name _;

    # 静态站点目录（由 frontend/scripts/export_static_site.py 生成）
    root /var/www/career-planner/static-site;
    index index.html;

    # 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存
    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Stream assistant replies without buffering model output.
    location /api/chat/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 动态 API 反向代理到 Flask
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


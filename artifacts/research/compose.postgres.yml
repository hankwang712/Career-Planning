name: career

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中填写数据库密码}

      # Docker 镜像使用 POSTGRES_DB
      # 对应 Python 配置中的 POSTGRES_DATABASE
      POSTGRES_DB: ${POSTGRES_DATABASE:-career_rag}

    ports:
      # Windows 端口 : 容器内部端口
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      # PostgreSQL 17 的数据库文件持久化目录
      - career_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  career_pgdata:
    external: true
    name: research_career_pgdata
